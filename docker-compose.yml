name: gilinc
services:
  postgres:
    image: postgres:17
    container_name: gilinc-postgres
    restart: unless-stopped
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: request_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
