name: request-service CI
on:
  pull_request:
    paths:
      - request-service/**
      - pom.xml
      - .github/workflows/request-service.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -pl request-service -am verify